<!doctype html>
<!--
  Known cases for browser-probe.js with no IBM Plex Sans Thai face: no face
  loads, so Thai and Latin text both report as not in it, and no Finnomena
  logo is found. A brand name in the plain logo alt and page text that no
  source brand was given for is not reported. run-probe.mjs --fixture
  compares the ids reported per category with #probe-expected.
-->
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design Day 2026</title>
<style>
  body { margin: 0; font-family: Arial, sans-serif; background: #fff; color: #111; }
</style>
</head>
<body>
  <h1 id="thai">งานออกแบบ 2026</h1>
  <p id="latin">Design Day</p>
  <img id="plain-logo" alt="Lumora" width="32" height="32" src="data:image/svg+xml,%3csvg%20xmlns='http://www.w3.org/2000/svg'/%3e">
  <script type="application/json" id="probe-expected">
    {
      "thaiTextInPlex": [],
      "thaiTextNotInPlex": ["thai"],
      "latinTextNotInPlex": ["latin"],
      "finnomenaLogo": [],
      "finnomenaLogoHidden": [],
      "sourceBrandFound": []
    }
  </script>
</body>
</html>
