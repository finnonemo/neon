<!doctype html>
<!--
  Known cases for browser-probe.js when IBM Plex Sans Thai's Latin subset
  loads but its Thai subset fails, as when one font file 404s: Latin text is
  in Plex, Thai text falls back, and the failed face is counted. The Latin
  face is a stand-in drawn from a local system font. run-probe.mjs --fixture
  compares the ids reported per category with #probe-expected.
-->
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design Day 2026</title>
<style>
  @font-face { font-family: "IBM Plex Sans Thai"; src: local("Arial"), local("Helvetica"), local("DejaVu Sans"); unicode-range: U+0000-024F; }
  @font-face { font-family: "IBM Plex Sans Thai"; src: url("missing-ibm-plex-sans-thai-thai.woff2") format("woff2"); unicode-range: U+0E00-0E7F; }
  body { margin: 0; font-family: "IBM Plex Sans Thai", sans-serif; background: #fff; color: #111; }
</style>
</head>
<body>
  <h1 id="thai">งานออกแบบ</h1>
  <p id="latin">Design Day</p>
  <script type="application/json" id="probe-expected">
    {
      "thaiTextInPlex": [],
      "thaiTextNotInPlex": ["thai"],
      "latinTextInPlex": ["latin"],
      "latinTextNotInPlex": []
    }
  </script>
</body>
</html>
